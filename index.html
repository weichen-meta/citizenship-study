<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>入籍考试备考</title>
    <style>
      :root{
        --bg:#f4f6f8; --surface:#ffffff; --surface2:#eef2f6;
        --ink:#17263c; --muted:#54657c; --line:#d5dde6;
        --accent:#1d4e89; --accent-ink:#ffffff;
        --red:#b3382c; --red-soft:#fbeae8;
        --green:#1e7d46; --green-soft:#e5f3ea;
        --amber-soft:#fdf3e0; --amber:#8a5a00;
        --shadow:0 2px 10px rgba(23,38,60,.08);
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#0f141c; --surface:#1a222e; --surface2:#232e3d;
          --ink:#edf2f8; --muted:#a3b1c3; --line:#31405a;
          --accent:#6ea8e8; --accent-ink:#0e1a2a;
          --red:#e08a7d; --red-soft:#3a2320;
          --green:#7cc79a; --green-soft:#1d2f26;
          --amber-soft:#33291a; --amber:#e3b96a;
          --shadow:0 2px 10px rgba(0,0,0,.35);
        }
      }
      *{box-sizing:border-box;}
      html{font-size:18px;}
      html,body{height:100%;}
      body{
        margin:0; background:var(--bg); color:var(--ink);
        font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
        line-height:1.55; -webkit-text-size-adjust:100%;
        overscroll-behavior:none;
      }

      /* ---------- app shell: one screen, no page scroll ---------- */
      .app{
        height:100dvh; max-width:680px; margin:0 auto;
        display:flex; flex-direction:column;
        padding:0 14px;
        padding-top:env(safe-area-inset-top);
      }
      .topbar{
        flex:0 0 auto; display:flex; align-items:center; gap:10px;
        padding:10px 0 6px; min-height:56px;
      }
      .back-btn{
        display:none;
        border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
        font:inherit; font-size:.98rem; font-weight:600; cursor:pointer;
        border-radius:10px; padding:9px 14px; min-height:46px;
      }
      .back-btn.show{display:block;}
      .back-spacer{width:86px; flex:0 0 auto;}
      .back-btn:active{transform:scale(.97);}
      .top-title{flex:1; font-size:1.12rem; font-weight:700; text-align:center; line-height:1.3;}
      .top-spacer{width:76px; flex:0 0 auto;}
      .top-right{flex:0 0 auto; min-width:76px; text-align:right; font-size:.9rem; color:var(--green); font-weight:700;}

      .setbar{
        flex:0 0 auto; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
        padding:2px 0 10px;
      }
      .tool-group{display:flex; align-items:center; gap:4px; background:var(--surface);
        border:1px solid var(--line); border-radius:999px; padding:3px; box-shadow:var(--shadow);}
      .tool-group .tg-label{font-size:.82rem; color:var(--muted); padding:0 2px 0 9px;}
      .seg-btn{
        border:none; background:transparent; color:var(--muted); cursor:pointer;
        font:inherit; font-size:.9rem; padding:7px 12px; border-radius:999px; min-height:38px;
      }
      .seg-btn.on{background:var(--accent); color:var(--accent-ink); font-weight:600;}

      .stage{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 0 14px;}
      .stage::-webkit-scrollbar{display:none;}
      .stage{scrollbar-width:none;}

      /* ---------- bottom pager ---------- */
      .pager{
        flex:0 0 auto; display:none; align-items:center; gap:10px;
        padding:10px 0 calc(10px + env(safe-area-inset-bottom));
        border-top:1px solid var(--line);
      }
      .pager.show{display:flex;}
      .pager .pbtn{
        flex:1; border:1px solid var(--line); background:var(--surface); color:var(--ink);
        font:inherit; font-size:1.08rem; font-weight:700; cursor:pointer;
        border-radius:12px; padding:14px 8px; min-height:58px; box-shadow:var(--shadow);
      }
      .pager .pbtn:active{transform:scale(.97);}
      .pager .pbtn:disabled{opacity:.35;}
      .pager .pcount{
        flex:0 0 auto; min-width:74px; text-align:center;
        font-size:1rem; font-weight:700; color:var(--muted);
      }
      .pager .pcount b{color:var(--ink); font-size:1.12rem;}

      /* ---------- menu lists (home / categories) ---------- */
      .view-intro{padding:6px 2px 2px;}
      .view-intro h1{font-size:1.45rem; margin:0 0 6px;}
      .view-intro p{margin:0 0 6px; color:var(--muted); font-size:.99rem;}
      .keyline{
        background:var(--amber-soft); border:1px solid var(--line); border-radius:10px;
        padding:10px 14px; font-size:.95rem; margin:10px 0 4px;
      }
      .keyline b{color:var(--amber);}
      .menu{display:flex; flex-direction:column; gap:12px; margin-top:14px;}
      .menu-btn{
        display:flex; align-items:center; gap:12px; text-align:left; width:100%;
        background:var(--surface); border:1px solid var(--line); border-radius:14px;
        box-shadow:var(--shadow); padding:18px 16px; cursor:pointer; font:inherit; color:var(--ink);
        min-height:76px;
      }
      .menu-btn:active{transform:scale(.99);}
      .menu-btn .mb-main{flex:1;}
      .menu-btn .mb-title{font-size:1.22rem; font-weight:700; line-height:1.3;}
      .menu-btn .mb-sub{font-size:.94rem; color:var(--muted); margin-top:2px;}
      .menu-btn .mb-arrow{font-size:1.4rem; color:var(--muted); flex:0 0 auto;}
      .menu-btn .mb-count{
        flex:0 0 auto; background:var(--surface2); border-radius:999px;
        font-size:.9rem; font-weight:700; color:var(--accent); padding:5px 12px;
      }
      .foot-note{margin-top:22px; color:var(--muted); font-size:.86rem; line-height:1.6;}
      .foot-note p{margin:0 0 6px;}
      .hint-line{color:var(--muted); font-size:.96rem; margin:6px 2px 0;}

      /* ---------- exercise card (one item per screen) ---------- */
      .card{
        background:var(--surface); border:1px solid var(--line); border-radius:14px;
        box-shadow:var(--shadow); padding:22px 18px 20px;
      }
      .q-cat{font-size:.88rem; color:var(--accent); font-weight:600; margin-bottom:10px;}
      .q-row{display:flex; gap:14px; align-items:flex-start;}
      .q-en{font-size:1.55rem; font-weight:700; line-height:1.35; flex:1;}
      .q-zh{font-size:1.12rem; color:var(--muted); margin-top:10px;}
      .any-note{font-size:.9rem; color:var(--amber); background:var(--amber-soft); border-radius:8px; padding:6px 10px; display:inline-block; margin-bottom:10px;}
      .answers{margin-top:18px; border-top:1.5px dashed var(--line); padding-top:14px; display:none;}
      .answers.show{display:block;}
      .ans-row{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line);}
      .ans-row:last-child{border-bottom:none;}
      .ans-main{flex:1;}
      .ans-en{font-size:1.3rem; font-weight:600; line-height:1.4;}
      .ans-zh{font-size:1.05rem; color:var(--muted); margin-top:2px;}
      .q-note{margin-top:14px; font-size:.95rem; color:var(--muted); background:var(--surface2); border-radius:8px; padding:10px 12px;}
      .card-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px;}
      .btn{
        flex:1 1 140px; cursor:pointer; font:inherit; font-size:1.05rem; font-weight:600;
        padding:15px 12px; border-radius:12px; min-height:56px;
        background:var(--surface2); color:var(--ink); border:1px solid var(--line);
      }
      .btn.primary{background:var(--red); color:#fff; border-color:var(--red);}
      @media (prefers-color-scheme: dark){ .btn.primary{color:#1c100e;} }
      .btn.marked{background:var(--green-soft); color:var(--green); border-color:var(--green);}
      .known-line{display:flex; justify-content:space-between; align-items:baseline; color:var(--muted); font-size:.92rem; margin:2px 2px 10px;}
      .known-line b{color:var(--green); font-size:1rem;}

      /* ---------- single sentence / word ---------- */
      .one-num{font-size:.9rem; color:var(--muted); margin-bottom:10px;}
      .one-en{font-size:1.6rem; font-weight:700; line-height:1.4;}
      .one-zh{font-size:1.14rem; color:var(--muted); margin-top:10px;}
      .one-speak{margin-top:22px; display:flex;}
      .one-speak .speak{flex:1; min-height:62px; font-size:1.08rem;}
      .word-en{font-size:2rem; font-weight:700; line-height:1.3; text-align:center; padding:14px 0 2px;}
      .word-zh{font-size:1.2rem; color:var(--muted); text-align:center; margin-top:8px;}
      .qa-tag{display:inline-block; font-size:.82rem; font-weight:700; padding:3px 10px; border-radius:999px; margin-bottom:10px;}
      .qa-tag.need-no{background:var(--red-soft); color:var(--red);}
      .qa-tag.need-yes{background:var(--green-soft); color:var(--green);}
      .qa-tag.truth{background:var(--amber-soft); color:var(--amber);}
      .ans-block{margin-top:16px; background:var(--surface2); border-radius:10px; padding:14px;}
      .ans-block .lbl{font-size:.85rem; color:var(--muted); margin-bottom:6px;}
      .ans-flex{display:flex; gap:12px; align-items:flex-start;}
      .ans-flex .ans-main{flex:1;}
      .dict-answer{display:none; margin-top:16px; border-top:1.5px dashed var(--line); padding-top:14px;}
      .dict-answer.show{display:block;}
      .reveal-btn{
        border:1.5px solid var(--accent); color:var(--accent); background:transparent; cursor:pointer;
        font:inherit; font-weight:600; font-size:1rem; padding:12px 18px; border-radius:10px; min-height:52px; width:100%;
      }
      .dict-hint{font-size:1rem; color:var(--muted); margin-top:12px;}

      /* ---------- speak button ---------- */
      .speak{
        flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:7px;
        border:none; cursor:pointer; border-radius:999px;
        background:var(--accent); color:var(--accent-ink);
        min-width:52px; min-height:52px; padding:10px 16px;
        font:inherit; font-size:.95rem; font-weight:600;
      }
      .speak svg{width:24px; height:24px; fill:currentColor;}
      .speak:active{transform:scale(.96);}
      .speak.playing{outline:3px solid var(--red); outline-offset:2px;}
      .speak.sm{min-width:44px; min-height:44px; padding:7px 12px;}
      .speak.sm svg{width:20px; height:20px;}

      body.hide-zh .zh{display:none !important;}

      .toast{
        position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
        background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:10px;
        font-size:.98rem; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50;
        max-width:88vw; text-align:center;
      }
      .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

      @media (max-width:560px){
        html{font-size:17px;}
        .q-en{font-size:1.36rem;}
        .one-en{font-size:1.42rem;}
        .ans-en{font-size:1.2rem;}
        .card{padding:18px 14px;}
        .top-spacer{display:none;}
        .top-right{min-width:0;}
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="back-spacer" id="backSpacer"></div>
        <button class="back-btn" id="backBtn" type="button">← 返回</button>
        <div class="top-title" id="topTitle">入籍考试备考</div>
        <div class="top-right" id="topRight"></div>
        <div class="top-spacer" id="topSpacer" style="display:none"></div>
      </header>

      <div class="setbar">
        <div class="tool-group" role="group" aria-label="中文翻译">
          <span class="tg-label">中文</span>
          <button class="seg-btn on" id="zhOn" type="button">显示</button>
          <button class="seg-btn" id="zhOff" type="button">隐藏（自测）</button>
        </div>
        <div class="tool-group" role="group" aria-label="朗读语速">
          <span class="tg-label">语速</span>
          <button class="seg-btn on" id="rateNormal" type="button">正常</button>
          <button class="seg-btn" id="rateSlow" type="button">慢速（逐词）</button>
        </div>
      </div>

      <main class="stage" id="stage"></main>

      <nav class="pager" id="pager" aria-label="翻页">
        <button class="pbtn" id="pagerPrev" type="button">← 上一个</button>
        <div class="pcount" id="pagerCount"></div>
        <button class="pbtn" id="pagerNext" type="button">下一个 →</button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script>
    "use strict";
    /* ================= speech ================= */
    var slowMode = false;
    var toastTimer = null;
    function toast(msg){
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
    }
    function pickVoice(){
      var voices = window.speechSynthesis.getVoices();
      var fallback = null;
      for(var i=0;i<voices.length;i++){
        var lang = (voices[i].lang || '').toLowerCase().replace('_','-');
        if(lang.indexOf('en-us') === 0){
          if(voices[i].localService || voices[i].default) return voices[i];
          if(!fallback) fallback = voices[i];
        }
      }
      return fallback;
    }
    function speak(text, btn){
      if(!('speechSynthesis' in window)){
        toast('这台设备不支持语音朗读，请换用 Safari 或 Chrome 打开');
        return;
      }
      try{
        var synth = window.speechSynthesis;
        synth.cancel();
        var playing = document.querySelectorAll('.speak.playing');
        for(var p=0;p<playing.length;p++) playing[p].classList.remove('playing');
        if(btn) btn.classList.add('playing');
        var voice = pickVoice();
        /* 慢速不能只靠调低 rate：不少手机自带语音会忽略 rate，听起来和正常没区别。
           慢速改为把句子拆成一个个词依次朗读，词与词之间留出停顿，慢得明确可感。 */
        var chunks = [text];
        if(slowMode){
          var words = text.split(/\s+/).filter(function(w){ return w.length > 0; });
          if(words.length > 1) chunks = words;
        }
        var lastIdx = chunks.length - 1;
        chunks.forEach(function(chunk, i){
          var u = new SpeechSynthesisUtterance(chunk);
          u.lang = 'en-US';
          if(voice) u.voice = voice;
          u.rate = slowMode ? (chunks.length > 1 ? 0.75 : 0.5) : 0.9;
          if(btn && i === lastIdx){
            u.onend = u.onerror = function(){ btn.classList.remove('playing'); };
          }
          synth.speak(u);
        });
      }catch(e){ toast('朗读失败，请再试一次'); }
    }
    if('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined){
      window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
    }
    var SPEAKER_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
    function speakBtn(text, small, label){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'speak' + (small ? ' sm' : '');
      b.setAttribute('aria-label', '播放发音：' + text);
      b.innerHTML = SPEAKER_SVG + (label ? '<span>' + label + '</span>' : '');
      b.addEventListener('click', function(ev){ ev.stopPropagation(); speak(text, b); });
      return b;
    }
    function el(tag, cls, text){
      var n = document.createElement(tag);
      if(cls) n.className = cls;
      if(text != null) n.textContent = text;
      return n;
    }
    function zh(cls, text){ return el('div', (cls ? cls + ' ' : '') + 'zh', text); }

    /* ================= toolbar ================= */
    var zhOn = document.getElementById('zhOn'), zhOff = document.getElementById('zhOff');
    zhOn.addEventListener('click', function(){
      document.body.classList.remove('hide-zh');
      zhOn.classList.add('on'); zhOff.classList.remove('on');
    });
    zhOff.addEventListener('click', function(){
      document.body.classList.add('hide-zh');
      zhOff.classList.add('on'); zhOn.classList.remove('on');
      toast('中文已隐藏，可以试着只看英文回忆意思');
    });
    var rateNormal = document.getElementById('rateNormal'), rateSlow = document.getElementById('rateSlow');
    rateNormal.addEventListener('click', function(){
      slowMode = false; rateNormal.classList.add('on'); rateSlow.classList.remove('on');
    });
    rateSlow.addEventListener('click', function(){
      slowMode = true; rateSlow.classList.add('on'); rateNormal.classList.remove('on');
      toast('已切换为慢速：一个词一个词慢慢读');
    });
    </script>

    <script>

    /* ================= app navigation: one item per screen ================= */

    var backSpacer = document.getElementById('backSpacer');

    var pagerPrev = document.getElementById('pagerPrev');
    var pagerNext = document.getElementById('pagerNext');
    var pagerCount = document.getElementById('pagerCount');

    var backTarget = null;      /* function to run when 返回 is tapped */
    var pagerState = null;      /* {cur, total, prev, next} while an exercise is open */

    backBtn.addEventListener('click', function(){ if(backTarget) backTarget(); });
    pagerPrev.addEventListener('click', function(){ if(pagerState) pagerState.prev(); });
    pagerNext.addEventListener('click', function(){ if(pagerState) pagerState.next(); });

    /* swipe left/right to turn the page inside an exercise */
    var touchX = null;
    stage.addEventListener('touchstart', function(e){
      touchX = e.changedTouches[0].clientX;
    }, {passive:true});
    stage.addEventListener('touchend', function(e){
      if(touchX === null || !pagerState) return;
      var dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if(dx < -60) pagerState.next();
      else if(dx > 60) pagerState.prev();
    }, {passive:true});

    function setChrome(title, backFn, rightText){
      topTitle.textContent = title;
      backTarget = backFn || null;
      backBtn.classList.toggle('show', !!backFn);
      backSpacer.style.display = backFn ? 'none' : 'block';
      topRight.textContent = rightText || '';
    }
    function setPager(cur, total, prevFn, nextFn){
      pagerState = { prev: prevFn, next: nextFn };
      pager.classList.add('show');
      pagerCount.innerHTML = '<b>' + cur + '</b> / ' + total;
      pagerPrev.disabled = cur <= 1;
      pagerNext.disabled = cur >= total;
    }
    function hidePager(){
      pagerState = null;
      pager.classList.remove('show');

      stage.innerHTML = '';

      stage.appendChild(menu);
      var foot = el('div','foot-note');
      foot.appendChild(el('p', null, '内容依据 USCIS 公布的 2025 版公民考试题库及官方阅读/写作词汇表整理。涉及所在州的题目（参议员、州长、州首府、众议员）以马萨诸塞州为例；现任总统、首席大法官、众议院议长等答案为 2026 年 10 月时的在任者，临近考试请再核对一次。'));
      foot.appendChild(el('p', null, '发音使用设备自带的英文朗读功能；点「慢速（逐词）」会把句子拆开、一个词一个词慢慢读，跟读和听写时更好跟。如果点了发音没声音，请先确认设备没有静音、音量已调大。'));
      stage.appendChild(foot);
    }

    /* ================= civics ================= */
    function showCivicsCats(){
      hidePager();
      setChrome('公民常识 · 选分类', showHome, '');
      clearStage();
      stage.appendChild(introBlock(null, '先听问题、看懂中文，再点「显示答案」对照记忆。答案有多个说法时，记住任意一条即可。觉得记住了，点「✓ 记住了」做个标记。'));
      var menu = el('div','menu');
      menu.appendChild(menuBtn('全部题目','按题库顺序从头练', CIVICS.length + ' 题', function(){ startCivics('all'); }));
      Object.keys(CATS).forEach(function(k){
        var n = CIVICS.filter(function(x){ return x.c===k; }).length;
        menu.appendChild(menuBtn(CATS[k], null, n + ' 题', function(){ startCivics(k); }));
      });
      stage.appendChild(menu);
    }
    function startCivics(f){
      civ.filter = f;
      civ.pool = f==='all' ? CIVICS.slice() : CIVICS.filter(function(x){ return x.c===f; });
      civ.idx = 0; civ.ans = false;
      showCivicsCard();
    }
    function civicsStep(d){
      civ.idx = (civ.idx + d + civ.pool.length) % civ.pool.length;
      civ.ans = false;
      showCivicsCard();
    }
    function showCivicsCard(){
      var item = civ.pool[civ.idx];
      var globalNum = CIVICS.indexOf(item) + 1;
      setChrome('公民常识', showCivicsCats, '');
      clearStage();
      var kl = el('div','known-line');
      var left = el('span', null, civ.filter==='all' ? '全部题目' : CATS[civ.filter]);
      var right = el('span'); right.innerHTML = '已记住 <b>' + Object.keys(known).length + '</b> / 128 题';
      kl.appendChild(left); kl.appendChild(right);
      stage.appendChild(kl);

      var card = el('div','card');
      card.appendChild(el('div','q-cat', CATS[item.c] + ' · 题库第 ' + globalNum + ' 题'));
      var qrow = el('div','q-row');
      qrow.appendChild(el('div','q-en', item.q));
      qrow.appendChild(speakBtn(item.q, false, '听问题'));
      card.appendChild(qrow);
      card.appendChild(zh('q-zh', item.qz));

      var ansBox = el('div','answers' + (civ.ans ? ' show' : ''));
      if(item.multi) ansBox.appendChild(el('span','any-note','答案不止一种说法 — 记住任意一条即可'));
      item.a.forEach(function(pair){
        var row = el('div','ans-row');
        var main = el('div','ans-main');
        main.appendChild(el('div','ans-en', pair[0]));
        main.appendChild(zh('ans-zh', pair[1]));
        row.appendChild(main);
        row.appendChild(speakBtn(pair[0], true));
        ansBox.appendChild(row);
      });
      if(item.note) ansBox.appendChild(zh('q-note', item.note));
      card.appendChild(ansBox);

      var actions = el('div','card-actions');
      var showBtn = el('button','btn primary', civ.ans ? '收起答案' : '显示答案');
      showBtn.type = 'button';
      showBtn.addEventListener('click', function(){ civ.ans = !civ.ans; showCivicsCard(); });
      var markBtn = el('button','btn' + (known[globalNum] ? ' marked' : ''), known[globalNum] ? '✓ 已记住（点此取消）' : '✓ 记住了');
      markBtn.type = 'button';
      markBtn.addEventListener('click', function(){
        if(known[globalNum]) delete known[globalNum]; else known[globalNum] = true;
        showCivicsCard();
      });
      var randBtn = el('button','btn','随机一题');
      randBtn.type = 'button';
      randBtn.addEventListener('click', function(){
        if(civ.pool.length > 1){
          var n; do { n = Math.floor(Math.random()*civ.pool.length); } while(n === civ.idx);
          civ.idx = n;
        }
        civ.ans = false; showCivicsCard();
      });
      actions.appendChild(showBtn);
      actions.appendChild(markBtn);
      actions.appendChild(randBtn);
      card.appendChild(actions);
      stage.appendChild(card);
      setPager(civ.idx + 1, civ.pool.length,
        function(){ civicsStep(-1); }, function(){ civicsStep(1); });
    }

    /* ================= reading ================= */
    function showReadMenu(){
      hidePager();
      setChrome('阅读', showHome, '');
      clearStage();
      stage.appendChild(introBlock(null, '考试时在平板上读句子，3 句读对 1 句就通过。句子都由官方词汇组成。先点发音听一遍，再跟着大声读。'));
      var menu = el('div','menu');
      menu.appendChild(menuBtn('读句子','一句一屏 · 先听再跟读', READ_SENTS.length + ' 句', function(){ rd.sentIdx = 0; showReadSent(); }));
      menu.appendChild(menuBtn('词汇表','一词一屏 · 点词听发音', vocabTotal(READ_VOCAB) + ' 词', function(){ showVocabGroups('read'); }));
      stage.appendChild(menu);
    }
    function showReadSent(){
      var p = READ_SENTS[rd.sentIdx];
      setChrome('阅读 · 读句子', showReadMenu, '');
      clearStage();
      var card = el('div','card');
      card.appendChild(el('div','one-num','第 ' + (rd.sentIdx+1) + ' 句'));
      card.appendChild(el('div','one-en', p[0]));
      card.appendChild(zh('one-zh', p[1]));
      var sp1 = el('div','one-speak');
      sp1.appendChild(speakBtn(p[0], false, '听发音，然后跟着读'));
      card.appendChild(sp1);
      stage.appendChild(card);
      setPager(rd.sentIdx + 1, READ_SENTS.length,
        function(){ rd.sentIdx = (rd.sentIdx - 1 + READ_SENTS.length) % READ_SENTS.length; showReadSent(); },
        function(){ rd.sentIdx = (rd.sentIdx + 1) % READ_SENTS.length; showReadSent(); });
    }

    /* ================= vocab (shared by reading / writing) ================= */
    function vocabData(kind){ return kind==='read' ? READ_VOCAB : WRITE_VOCAB; }
    function vocabState(kind){ return kind==='read' ? rd : wr; }
    function showVocabGroups(kind){
      hidePager();
      var back = kind==='read' ? showReadMenu : showWriteMenu;
      setChrome(kind==='read' ? '阅读 · 词汇表' : '写作 · 词汇表', back, '');
      clearStage();
      stage.appendChild(introBlock(null, kind==='read'
        ? '考试的句子只会用到这些词。一词一屏，点发音听一遍，跟着读几遍。'
        : '听写句子只由这些词组成。重点练拼写：一词一屏，点词听发音，然后默写出来对照。'));
      var data = vocabData(kind);
      var menu = el('div','menu');
      data.forEach(function(g, gi){
        menu.appendChild(menuBtn(g[0] + '词汇', null, g[1].length + ' 词', function(){
          var st = vocabState(kind); st.vg = gi; st.vw = 0; showVocabCard(kind);
        }));
      });
      stage.appendChild(menu);
    }
    function showVocabCard(kind){
      var data = vocabData(kind);
      var st = vocabState(kind);
      var group = data[st.vg];
      var pair = group[1][st.vw];
      setChrome(kind==='read' ? '阅读 · 词汇' : '写作 · 词汇', function(){ showVocabGroups(kind); }, '');
      clearStage();
      var card = el('div','card');
      card.appendChild(el('div','one-num', group[0] + '词汇'));
      card.appendChild(el('div','word-en', pair[0]));
      card.appendChild(zh('word-zh', pair[1]));
      var sp1 = el('div','one-speak');
      sp1.appendChild(speakBtn(pair[0], false, '听发音'));
      card.appendChild(sp1);
      stage.appendChild(card);
      setPager(st.vw + 1, group[1].length,
        function(){ st.vw = (st.vw - 1 + group[1].length) % group[1].length; showVocabCard(kind); },
        function(){ st.vw = (st.vw + 1) % group[1].length; showVocabCard(kind); });
    }

    /* ================= writing ================= */
    function showWriteMenu(){
      hidePager();
      setChrome('写作（听写）', showHome, '');
      clearStage();
      stage.appendChild(introBlock(null, '考试时移民官念一句，你在平板上写下来，3 句写对 1 句就通过。拼写、大小写有小错误没关系。'));
      var menu = el('div','menu');
      menu.appendChild(menuBtn('听写句子','先听 · 在纸上写 · 再对照', WRITE_SENTS.length + ' 句', function(){ wr.sentIdx = 0; wr.shown = false; showWriteSent(); }));
      menu.appendChild(menuBtn('词汇表','一词一屏 · 练拼写', vocabTotal(WRITE_VOCAB) + ' 词', function(){ showVocabGroups('write'); }));
      stage.appendChild(menu);
    }
    function showWriteSent(){
      var p = WRITE_SENTS[wr.sentIdx];
      setChrome('写作 · 听写', showWriteMenu, '');
      clearStage();
      var card = el('div','card');
      card.appendChild(el('div','one-num','第 ' + (wr.sentIdx+1) + ' 句'));
      var sp1 = el('div','one-speak'); sp1.style.marginTop = '4px';
      sp1.appendChild(speakBtn(p[0], false, '听句子'));
      card.appendChild(sp1);
      card.appendChild(el('div','dict-hint','先听，在纸上写下来，再点下面的按钮对照检查。'));
      var ans = el('div','dict-answer' + (wr.shown ? ' show' : ''));
      var flex = el('div','ans-flex');
      var main = el('div','ans-main');
      main.appendChild(el('div','one-en', p[0]));
      main.appendChild(zh('one-zh', p[1]));
      flex.appendChild(main);
      flex.appendChild(speakBtn(p[0], true));
      ans.appendChild(flex);
      card.appendChild(ans);
      var rb = el('button','reveal-btn', wr.shown ? '藏起来' : '显示句子');
      rb.type = 'button';
      rb.style.marginTop = '16px';
      rb.addEventListener('click', function(){ wr.shown = !wr.shown; showWriteSent(); });
      card.appendChild(rb);
      stage.appendChild(card);
      setPager(wr.sentIdx + 1, WRITE_SENTS.length,
        function(){ wr.sentIdx = (wr.sentIdx - 1 + WRITE_SENTS.length) % WRITE_SENTS.length; wr.shown = false; showWriteSent(); },
        function(){ wr.sentIdx = (wr.sentIdx + 1) % WRITE_SENTS.length; wr.shown = false; showWriteSent(); });
    }

    /* ================= speaking ================= */
    var TAG_TXT = { no:'通常答 No', yes:'答 Yes', truth:'按实情回答' };
    function showSpeakGroups(){
      hidePager();
      setChrome('面试口语', showHome, '');
      clearStage();
      stage.appendChild(introBlock(null, '没有单独的口语试卷：移民官在面试聊天中判断你能不能听懂、用英语回答。先把问题听熟，再记住参考答法。带「按实情回答」的题目，务必按自己的真实情况回答，不要背别人的答案。'));
      var menu = el('div','menu');
      SPEAK_GROUPS.forEach(function(g, gi){
        menu.appendChild(menuBtn(g.title, g.sub, g.items.length + ' 题', function(){
          sp.g = gi; sp.idx = 0; showSpeakCard();
        }));
      });
      stage.appendChild(menu);
    }
    function showSpeakCard(){
      var g = SPEAK_GROUPS[sp.g];
      var it = g.items[sp.idx];
      setChrome('面试口语', showSpeakGroups, '');
      clearStage();
      var card = el('div','card');
      card.appendChild(el('div','q-cat', g.title));
      if(it.tag && TAG_TXT[it.tag]){
        card.appendChild(el('span','qa-tag ' + (it.tag==='no' ? 'need-no' : it.tag==='yes' ? 'need-yes' : 'truth'), TAG_TXT[it.tag]));
      }
      var qflex = el('div','ans-flex');
      var qmain = el('div','ans-main');
      qmain.appendChild(el('div','one-en', it.q));
      qmain.appendChild(zh('one-zh', it.qz));
      qflex.appendChild(qmain);
      qflex.appendChild(speakBtn(it.q, true));
      card.appendChild(qflex);
      var ab = el('div','ans-block');
      ab.appendChild(el('div','lbl','参考答法'));
      var aflex = el('div','ans-flex');
      var amain = el('div','ans-main');
      amain.appendChild(el('div','ans-en', it.a));
      amain.appendChild(zh('ans-zh', it.az));
      aflex.appendChild(amain);
      aflex.appendChild(speakBtn(it.a, true));
      ab.appendChild(aflex);
      card.appendChild(ab);
      stage.appendChild(card);
      setPager(sp.idx + 1, g.items.length,
        function(){ sp.idx = (sp.idx - 1 + g.items.length) % g.items.length; showSpeakCard(); },
        function(){ sp.idx = (sp.idx + 1) % g.items.length; showSpeakCard(); });
    }

    showHome();
    </script>
</body>
</html>
